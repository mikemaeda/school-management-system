name: Sync local UI source

on:
  push:
    paths:
      - .github/workflows/sync-local-ui.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact local SchoolManagementSystem.java
        run: |
          python - <<'PY'
          import base64
          import gzip
          from pathlib import Path

          encoded = """
          
          """
          raw = base64.b64decode("".join(encoded.split()))
          out = gzip.decompress(raw)
          target = Path("src/main/java/schoolmanagement/SchoolManagementSystem.java")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(out)
          PY
      - name: Commit restored source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/schoolmanagement/SchoolManagementSystem.java
          if git diff --cached --quiet; then
            echo "SchoolManagementSystem.java already matches."
            exit 0
          fi
          git commit -m "Sync exact local Swing UI source"
          git push
